<!-- Confirm Delete Modal -->
<div x-data="{ open: false, url: '', name: '' }"
    @confirm-delete.window="open = true; url = $event.detail.url; name = $event.detail.name">
    <template x-if="open">
        <div class="fixed inset-0 z-50 flex items-center justify-center">
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" @click="open = false"></div>
            <div
                class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-6 max-w-md w-full mx-4 border border-slate-200 dark:border-slate-700">
                <h3 class="text-lg font-semibold text-slate-900 dark:text-white mb-2">Confirmar Exclusão</h3>
                <p class="text-sm text-slate-600 dark:text-slate-400 mb-6">
                    Tem certeza que deseja excluir <strong x-text="name"
                        class="text-slate-900 dark:text-white"></strong>?
                    Esta ação não pode ser desfeita.
                </p>
                <div class="flex justify-end gap-3">
                    <button @click="open = false" class="btn-secondary">Cancelar</button>
                    <form :action="url" method="POST" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="btn-danger">Excluir</button>
                    </form>
                </div>
            </div>
        </div>
    </template>
</div>
