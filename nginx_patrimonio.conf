# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name patrimonio.sistema9.com.br;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name patrimonio.sistema9.com.br;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/sistema9.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistema9.com.br/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    location = /favicon.ico { access_log off; log_not_found off; }
    
    location /static/ {
        alias /var/www/controle_patrimonial/staticfiles/;
    }
    
    location /media/ {
        alias /var/www/controle_patrimonial/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
